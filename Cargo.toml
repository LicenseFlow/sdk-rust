[package]
name = "licenseflow"
version = "2.1.0"
edition = "2021"
description = "Official Rust SDK for the LicenseFlow software licensing & entitlement data plane"
license = "MIT OR Apache-2.0"
repository = "https://github.com/licenseflow/licenseflow-rs"
keywords = ["licensing", "entitlements", "drm", "license-keys", "ed25519"]
categories = ["api-bindings", "development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"], optional = true }
ed25519-dalek = { version = "2.1", optional = true }
base64 = { version = "0.21", optional = true }

[features]
default = ["client", "offline"]
client = ["dep:reqwest"]
offline = ["dep:ed25519-dalek", "dep:base64"]
